name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the secret scan reads the whole history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Format, module, tests and cross-compilation
        run: scripts/check.sh --cross
      - name: Secret scan of the history
        run: python3 scripts/scan_secrets.py
      - name: Race detector
        run: go test -race ./...
